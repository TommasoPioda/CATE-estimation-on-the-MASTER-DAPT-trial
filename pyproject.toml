[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis_utils"
version = "0.1.0"
description = "Shared ML/CATE pipeline utilities for the DAPT bachelor thesis project."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
